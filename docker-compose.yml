services:
  web:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:-latest}
    container_name: map-web
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3