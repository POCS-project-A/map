services:
  web:
    platform: linux/arm64
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:?IMAGE_NAME is required}:${IMAGE_TAG:-latest}
    container_name: map-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: map-api
    restart: unless-stopped
    expose:
      - "8000"